<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신랑이랑 함께하는 골프여행</title>
    <style>
        /* 어두운 테마 (Dark Theme) 고급스럽게 설정 */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --title-color: #bb86fc;
            --accent-color: #03dac6;
            --border-color: #333333;
            --btn-bg: #bb86fc;
            --btn-text: #000000;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 18px; /* 글자를 시원하게 크게 */
            line-height: 1.7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            color: var(--title-color);
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 검색창 디자인 */
        .search-container {
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--title-color);
        }

        /* 카드 레이아웃 (반응형) */
        .card-grid {
            display: grid;
            gap: 25px;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .card-grid {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card h2 {
            margin-top: 0;
            color: var(--title-color);
            font-size: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* 일정표 스타일 */
        .schedule-day {
            margin-bottom: 15px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
        }

        .schedule-day h3 {
            margin: 0 0 10px 0;
            color: var(--accent-color);
            font-size: 20px;
        }

        /* 버튼 디자인 */
        .btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* 지도 버튼 전용 스타일 */
        .map-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .map-btn {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }

        .google-map {
            background-color: #4285F4;
            color: white;
            border: none;
        }

        .naver-map {
            background-color: #03C75A;
            color: white;
            border: none;
        }

        /* 숨겨진 상세 내용 */
        .details {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 체크리스트 스타일 */
        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
        }

        .check-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏌️‍♀️ 신랑이랑 오붓하게, 커플 골프여행</h1>
        <p>비행기 5시간 이내! 태국 & 일본 완전 정복</p>
    </header>

    <!-- 1. 검색 기능 -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 궁금한 내용을 검색해보세요 (예: 2박, 태국, 지도)" onkeyup="filterCards()">
    </div>

    <!-- 카드 리스트 시작 -->
    <div class="card-grid" id="cardContainer">
        
        <!-- 카드 1: 태국 매력 -->
        <div class="card">
            <h2>🇹🇭 태국의 매력 (휴양+골프)</h2>
            <p>1년 내내 따뜻한 날씨와 저렴한 물가가 장점!</p>
            <ul>
                <li><strong>비행시간:</strong> 약 5~6시간 (방콕/치앙마이)</li>
                <li><strong>장점:</strong> 라운딩 후 1일 1마사지 가능! 캐디 1인 1캐디 시스템으로 황제 골프.</li>
                <li><strong>추천대상:</strong> 골프도 치고 수영장 휴양도 즐기고 싶은 부부.</li>
            </ul>
        </div>

        <!-- 카드 2: 일본 매력 -->
        <div class="card">
            <h2>🇯🇵 일본의 매력 (미
